name: env-guard
description: >-
  tracked な .env 系ファイルに平文の値が残っていないかを検査する。判定は
  コミット時の pre-commit hook が呼ぶのと同じ 1 本のスキャナが行う。

# なぜ reusable workflow ではなく composite action なのか（実測に基づく）
#
# 検査の実体は images/runtime-base/bin/env-guard-scan 1 本で、これを hook と
# CI の両方が使う。CI 側は「karakuri のどの版のスキャナを使うか」を決める
# 必要があり、reusable workflow ではそれを github.job_workflow_ref から
# 割り出す設計にしていた。
#
# 実測（2026-08-06、CI 12〜13 回目）: github.job_workflow_ref は**空だった**。
# ローカルパス呼び出し（uses: ./...）でも完全参照呼び出し
# （uses: owner/repo/...@ref）でも空である。同じ github コンテキストの
# workflow_ref は正しく埋まっていたので、コンテキストの取得自体は機能して
# いる。workflow_ref は代用にならない — 指しているのは**呼び出し側**の
# workflow であり、他 org から呼ばれれば他 org のリポジトリを指す。
# karakuri が自分を呼ぶときだけ動いて他所では壊れる、という最悪の形になる。
#
# composite action にはこの問題が無い。`uses:` された時点で action の
# リポジトリが指定された ref で checkout され、その中身へ
# ${{ github.action_path }} から到達できる。**自分の ref を割り出す必要が
# そもそも無い。** 呼び出し側が @v1 と書けば v1 のスキャナが走る。
#
# 代償は、呼び出し側のスタブが reusable workflow より数行長くなること
# （runs-on と checkout を呼び出し側が書く）。ref を割り出せない以上、
# 選択肢は「呼び出し側が数行書く」か「スキャナを workflow の中に複製して
# 同一性をテストで担保する」かで、複製しない方を採る。

inputs:
  paths:
    description: >-
      検査対象を絞りたい場合のディレクトリ。改行区切りで複数指定できる。
      既定（空）ではリポジトリ全体を検査する。これは「どこまで見るか」だけの
      指定であって、平文かどうかの判定を変えるものではない（判定は
      リポジトリルートの env-guard.conf とスキャナに閉じている）。指定すると
      CI はコミット時の hook より狭い範囲しか見ないことになる点に注意。
      なお .env.keys（私鍵そのもの）の探索だけはこの絞り込みに関係なく
      リポジトリ全体に効く。
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Locate the shared scanner
      id: scanner
      shell: bash
      run: |
        set -u

        # action のリポジトリは丸ごと checkout される前提で、action 自身の
        # 位置からの相対でスキャナを引く。この前提が崩れていれば下の存在
        # 検査で落ちるので、黙って別のものを走らせることはない。
        #
        # スキャナを action ディレクトリの中へ置かないのは、runtime-base の
        # docker build コンテキストが images/runtime-base であり、そこから
        # 出た場所のファイルを COPY できないため。イメージと CI で同じ 1 本を
        # 使うという要件の方が、パスの短さより優先する。
        scan="$GITHUB_ACTION_PATH/../../../images/runtime-base/bin/env-guard-scan"

        if [ ! -s "$scan" ]; then
          echo "❌ env-guard: the shared scanner is not where this action expects it."
          echo "   looked for: $scan"
          echo "   GITHUB_ACTION_PATH: ${GITHUB_ACTION_PATH:-<empty>}"
          echo "   Nothing was inspected, so this is not a pass."
          echo "--- what is actually there ---"
          ls -la "$GITHUB_ACTION_PATH" 2>&1 || true
          ls -la "$GITHUB_ACTION_PATH/../../.." 2>&1 || true
          exit 1
        fi

        # 呼び出し側の作業ツリーの外へ出してから使う。作業ツリーの中に置くと
        # 検査対象のファイル一覧や .env.keys の探索範囲に混ざりうる。
        cp "$scan" "$RUNNER_TEMP/env-guard-scan"
        chmod +x "$RUNNER_TEMP/env-guard-scan"
        echo "scanner: $scan"

    - name: Scan tracked files for plaintext env values
      shell: bash
      env:
        ENV_GUARD_PATHS: ${{ inputs.paths }}
      run: |
        set -u
        list="$RUNNER_TEMP/env-guard-list"
        ok=0

        # 一覧の作成に失敗したら通さない (fail-closed)。空の一覧は
        # 「検査対象が無かった」を意味するが、コマンド自体の失敗も同じ
        # 「空」に化けるため区別する。
        if [ -n "${ENV_GUARD_PATHS:-}" ]; then
          # 改行/空白区切りの複数ディレクトリを受けるため、ここだけは
          # 意図的に単語分割させる。
          # shellcheck disable=SC2086
          set -- $ENV_GUARD_PATHS
          git ls-files -- "$@" >"$list" || ok=$?
        else
          git ls-files >"$list" || ok=$?
        fi

        if [ "$ok" -ne 0 ]; then
          echo "❌ env-guard: could not list the tracked files (git ls-files failed)."
          echo "   Nothing was inspected, so this is not a pass."
          exit 1
        fi

        echo "env-guard: $(wc -l <"$list") tracked path(s) to consider."
        "$RUNNER_TEMP/env-guard-scan" <"$list"
