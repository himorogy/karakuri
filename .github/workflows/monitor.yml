name: Registry Monitor

# レジストリ上の版とリポジトリの状態を毎日照合し、経路を通らずに
# 公開された版を検出する。判定の意味は docs/secure-publish.md §6 を参照。
#
# あわせて devcontainer base image について 2 つ見る。pin している egress-guard の
# 版がレジストリの最新から遅れていないか（base の再ビルドは手動のため、上げ忘れを
# ここで拾う）と、GHCR 上の版が git タグと対応しているか。
on:
  schedule:
    - cron: "0 0 * * *" # 毎日 09:00 JST
  workflow_dispatch: # 手動実行（テスト用）

permissions: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # 全タグを取得

      - name: Check registry and notify Slack
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITOR_WEBHOOK_URL }}
        run: |
          set -eu

          # 単一パッケージ時代に v<ver> 形式で打たれたタグ。
          # 新形式 <pkg>@<ver> へ移行済みなので、これ以上は増えない。
          # v<ver> を無条件に受け入れると、パッケージが増えた今は
          # 別パッケージの同じ版数に当たってしまう（egress-guard 0.2.0 が
          # enclave-env の v0.2.0 で「タグあり」と判定される）ため、
          # 対象を明示的に列挙する。
          LEGACY_TAGGED="@himorogy/enclave-env@0.2.0 @himorogy/enclave-env@0.2.1"

          STATUS="ok"
          TEXT=""

          # ok < warn < alert。一度上げた深刻度は下げない。
          escalate() {
            case "$1" in
              alert) STATUS="alert" ;;
              warn)  [ "$STATUS" = "alert" ] || STATUS="warn" ;;
            esac
          }

          # 監視対象はワークスペースから引く。パッケージが増えても
          # このファイルを触らなくてよい。
          for manifest in packages/*/package.json; do
            PACKAGE=$(jq -r 'select(.private != true) | .name // empty' "$manifest")
            [ -n "$PACKAGE" ] || continue

            TEXT="${TEXT}*${PACKAGE}*\n"

            NPM_RAW=$(npm view "$PACKAGE" versions --json 2>/dev/null) || NPM_RAW=""

            if [ -z "$NPM_RAW" ]; then
              TEXT="${TEXT}⚠️ npm registry に未 publish（または取得失敗）\n\n"
              escalate warn
              continue
            fi

            # npm view は版数が 1 つだと文字列、複数だと配列を返すため正規化
            VERSIONS=$(printf '%s' "$NPM_RAW" | \
              jq -r 'if type == "string" then [.] else . end | .[]')

            # --- 1. タグとの照合 ---
            # タグは公開の原因であり、レジストリ上の版はその結果である。
            # 対応するタグを持たない版は、経路を通らずに公開されたもの。
            UNTAGGED=""
            while IFS= read -r v; do
              [ -n "$v" ] || continue

              if git rev-parse -q --verify "refs/tags/${PACKAGE}@${v}" >/dev/null; then
                continue
              fi

              case " ${LEGACY_TAGGED} " in
                *" ${PACKAGE}@${v} "*)
                  if git rev-parse -q --verify "refs/tags/v${v}" >/dev/null; then
                    continue
                  fi
                  ;;
              esac

              UNTAGGED="${UNTAGGED}${v} "
            done <<< "$VERSIONS"

            if [ -n "$UNTAGGED" ]; then
              TEXT="${TEXT}🚨 git tag のない版: ${UNTAGGED}\n"
              escalate alert
            else
              TEXT="${TEXT}✅ タグ整合 OK\n"
            fi

            # --- 2. 出所証明の確認 ---
            # タグ照合が見ているのはタグ名の存在だけで、成果物の中身に
            # ついては何も保証しない。attestation はビルド元を暗号的に
            # 示すため、本来の検証はこちらにあたる。
            #
            # 移行前に手で公開された版には付かないので、最新版だけを見る。
            # 移行後は常に付くはずで、付いていなければ経路外を疑う。
            LATEST=$(printf '%s' "$VERSIONS" | tail -1)
            ATTESTATION=$(npm view "${PACKAGE}@${LATEST}" --json 2>/dev/null \
              | jq -r '.dist.attestations.url // empty') || ATTESTATION=""

            if [ -n "$ATTESTATION" ]; then
              TEXT="${TEXT}✅ 最新版 ${LATEST} に provenance あり\n\n"
            else
              TEXT="${TEXT}⚠️ 最新版 ${LATEST} に provenance なし\n\n"
              escalate warn
            fi
          done

          # --- 3. base image が pin している egress-guard の版 ---
          # egress-guard のスクリプト本体は base image に焼かれており、
          # プロジェクト側から差し替えられない。上げるレバーは base の ARG しか
          # ないため、上げ忘れると全プロジェクトが古い版のまま動き続ける。
          # 落ちるのはセキュリティ制御そのものなので、乖離をここで見る。
          BASE_DOCKERFILE="images/devcontainer-base/Dockerfile"
          GUARD_PACKAGE="@himorogy/egress-guard"

          if [ -f "$BASE_DOCKERFILE" ]; then
            TEXT="${TEXT}*devcontainer-base*\n"

            PINNED=$(sed -n 's/^ARG EGRESS_GUARD_VERSION=//p' "$BASE_DOCKERFILE" | head -1)
            GUARD_LATEST=$(npm view "$GUARD_PACKAGE" version 2>/dev/null) || GUARD_LATEST=""

            if [ -z "$PINNED" ]; then
              TEXT="${TEXT}⚠️ ${BASE_DOCKERFILE} から ARG EGRESS_GUARD_VERSION を読めない\n\n"
              escalate warn
            elif [ -z "$GUARD_LATEST" ]; then
              TEXT="${TEXT}⚠️ ${GUARD_PACKAGE} の最新版を取得できない\n\n"
              escalate warn
            elif [ "$PINNED" != "$GUARD_LATEST" ]; then
              TEXT="${TEXT}⚠️ egress-guard の pin が ${PINNED}、最新は ${GUARD_LATEST}。base の再ビルドが要る\n\n"
              escalate warn
            else
              TEXT="${TEXT}✅ egress-guard ${PINNED} は最新\n\n"
            fi
          fi

          # --- 4. GHCR 上の版とタグの照合 ---
          # npm と同じ考え方で、タグが公開の原因、レジストリ上の版はその結果。
          # 対応する git タグを持たない版は、経路を通らずに push されたもの。
          #
          # 浮動タグ (1, 1.0) と sha- 付きは判定対象から外す。前者はリリース版を
          # 指す別名で、後者はコミットを指すものなので、いずれも「版」ではない。
          GHCR_PATH="${GITHUB_REPOSITORY_OWNER}/devcontainer-base"

          TEXT="${TEXT}*devcontainer-base (GHCR)*\n"

          GHCR_TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${GHCR_PATH}:pull" \
            | jq -r '.token // empty') || GHCR_TOKEN=""

          if [ -z "$GHCR_TOKEN" ]; then
            TEXT="${TEXT}⚠️ GHCR のトークンを取得できない\n\n"
            escalate warn
          else
            GHCR_TAGS=$(curl -fsS -H "Authorization: Bearer ${GHCR_TOKEN}" \
              "https://ghcr.io/v2/${GHCR_PATH}/tags/list" \
              | jq -r '.tags[]? // empty') || GHCR_TAGS=""

            if [ -z "$GHCR_TAGS" ]; then
              TEXT="${TEXT}⚠️ GHCR のタグ一覧を取得できない\n\n"
              escalate warn
            else
              GHCR_UNTAGGED=""
              while IFS= read -r t; do
                [ -n "$t" ] || continue

                # X.Y.Z 形式だけが版。それ以外は別名かコミット参照。
                printf '%s' "$t" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || continue

                if git rev-parse -q --verify "refs/tags/devcontainer-base-v${t}" >/dev/null; then
                  continue
                fi

                GHCR_UNTAGGED="${GHCR_UNTAGGED}${t} "
              done <<< "$GHCR_TAGS"

              if [ -n "$GHCR_UNTAGGED" ]; then
                TEXT="${TEXT}🚨 git tag のない版: ${GHCR_UNTAGGED}\n\n"
                escalate alert
              else
                TEXT="${TEXT}✅ タグ整合 OK\n\n"
              fi
            fi
          fi

          # --- Slack 通知 ---
          case "$STATUS" in
            ok)    COLOR="#36a64f"; LABEL="正常 :white_check_mark:" ;;
            warn)  COLOR="#ff9900"; LABEL="警告 :warning:" ;;
            alert) COLOR="#ff0000"; LABEL="異常検知 :rotating_light:" ;;
          esac

          jq -n \
            --arg color  "$COLOR" \
            --arg title  "公開経路の監視: ${LABEL}" \
            --arg text   "$(printf '%b' "$TEXT")" \
            --arg footer "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            '{attachments:[{
              color:   $color,
              title:   $title,
              text:    $text,
              footer:  $footer,
              mrkdwn_in: ["text"]
            }]}' \
          | curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d @-
