name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # 平文 env のコミット検知。karakuri は各プロジェクトへこの検査を配る側
  # だが、自分で使っていない伝播機構は壊れていても気付けないので、karakuri
  # 自身も呼び出し側の 1 つとして通す。
  #
  # 呼び出し方がプロジェクト側のスタブ
  # (images/runtime-base/templates/project/env-guard.yml) と違い、`himorogy/karakuri/
  # .github/workflows/env-guard.yml@<commit sha>` ではなくローカルパス参照に
  # なっているのは意図的である。他リポジトリを指す形にすると、PR で変更した
  # 版ではなく公開済みの版が走ってしまい、その PR の変更が CI に掛からない。
  # ローカルパス参照だと、呼ばれた workflow は作業ツリーのスキャナを見つけて
  # そちらを使う (npm から取りにいかない)。self-call ではそれが正しい。
  #
  # 検査の実体は packages/env-guard/bin/env-guard-scan（コミット時の
  # pre-commit hook が呼ぶのと同じ 1 本）で、workflow はそれを取り出して
  # tracked ファイルの一覧を流すだけである。そのスキャナが平文を実際に
  # 検出できること、および hook と CI が同じ判定を返すことの証明は、この
  # 呼び出しではなく `pnpm test` から走る
  # images/runtime-base/tests/env-guard.test.sh が行う（下の test ジョブ）。
  # 緑になった検査は「検知できたから緑」なのか「検知できないから緑」なのか、
  # 呼び出し側からは区別が付かない。
  env-guard:
    uses: ./.github/workflows/env-guard.yml

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # シェルスクリプトはこのリポジトリの成果物そのもの（egress-guard）。
      # biome は触れないため別に走らせる。shellcheck は ubuntu-latest に同梱。
      - run: pnpm lint:sh

      - run: pnpm test

  # host/shims/_dotenvx.cmd は手書きの Windows バッチファイルで、cmd.exe の
  # errorlevel 伝播漏れ（別のバッチファイルを call 無しで呼ぶと制御が戻らず、
  # 落ちるべきときに 0 で返る）という古典的な罠を踏みうる。bash から呼ぶと
  # .cmd の解決も errorlevel の伝播も検査したい経路を通らないため、cmd.exe
  # から実行して固定する。検査するのは POSIX 側と重複しない 2 点だけ:
  # 鍵が無いときに非ゼロで返ること、鍵があるときに実体が起動すること。
  host-shim-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: fails when no DOTENV_PRIVATE_KEY* is set
        run: |
          set DOTENV_PRIVATE_KEY=
          call images\runtime-base\templates\host\shims\_dotenvx.cmd run -- echo unused
          if %errorlevel% EQU 0 (
            echo expected a non-zero exit when no key is set
            exit /b 1
          )
          exit /b 0

      - name: starts the real entity when a key is set
        run: |
          mkdir "%RUNNER_TEMP%\fakebin"
          (
            echo @echo off
            echo echo real dotenvx invoked with: %%*
          ) > "%RUNNER_TEMP%\fakebin\dotenvx.cmd"
          set "PATH=%RUNNER_TEMP%\fakebin;%PATH%"
          set DOTENV_PRIVATE_KEY_PROD=stub-value
          call images\runtime-base\templates\host\shims\_dotenvx.cmd run -- echo unused > out.txt
          type out.txt
          findstr /c:"real dotenvx invoked with" out.txt
          if %errorlevel% NEQ 0 (
            echo expected the fake dotenvx entity to run
            exit /b 1
          )
