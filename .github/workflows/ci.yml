name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # シェルスクリプトはこのリポジトリの成果物そのもの（egress-guard）。
      # biome は触れないため別に走らせる。shellcheck は ubuntu-latest に同梱。
      - run: pnpm lint:sh

      - run: pnpm test
