name: devcontainer-base

# images/devcontainer-base のマルチアーキビルドと GHCR への push。
#
# トリガーの使い分け:
#   tag push (devcontainer-base-v*) … リリース。:1 / :1.4 / :1.4.2 / sha-xxxxxxx を push
#   pull_request                    … 検証ビルドのみ。push しない
#   workflow_dispatch               … 任意ビルド。push するかは入力で選択（:edge が付く）
#
# main への push はトリガーにしていない。浮動タグ :1 を参照する運用では
# 利用側が引くのはリリースタグだけで、main の各コミットを GHCR に積む必要がないため。
#
# action は全て commit SHA で固定する。タグは移動しうるため、上流が侵害されたときに
# そのまま実行されることを防ぐ。併記しているタグは、更新時に何を見ればよいかの手がかり。
#
# docker/* の 5 つはリポジトリの action 許可リストに明示的に載せてある。このジョブは
# packages: write を持つため、第三者 action を動かすこと自体が
# docs/secure-publish.md §4.3 の原則から外れる。判断の根拠と、将来これを外す道筋は
# 同 §4.6 を参照。

on:
  push:
    tags:
      - "devcontainer-base-v*"
  pull_request:
    paths:
      - "images/devcontainer-base/**"
      - ".github/workflows/devcontainer-base.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "GHCR に push する（:edge タグが付く）"
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devcontainer-base
  CONTEXT: images/devcontainer-base

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # タグ名 devcontainer-base-v1.4.2 から 1.4.2 を取り出す。
      # metadata-action の type=semver は value を明示すれば ref に依存しない。
      - name: Resolve version from tag
        id: ver
        if: startsWith(github.ref, 'refs/tags/devcontainer-base-v')
        run: |
          version="${GITHUB_REF_NAME#devcontainer-base-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: タグ形式が不正です: ${GITHUB_REF_NAME}" >&2
            echo "  期待する形式: devcontainer-base-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # push するのはリリースタグのとき、または dispatch で明示指定したとき。
      - name: Decide whether to push
        id: cond
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/devcontainer-base-v') }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: steps.cond.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # metadata-action のデフォルト (latest=auto) は type=semver が有効なとき
          # :latest も生成する。タグ体系に含めていないので明示的に止める。
          flavor: |
            latest=false
          # semver の 3 行が :1.4.2 / :1.4 / :1 を生む。
          # value を渡しているのでタグ以外のイベントでは enable が false になり無視される。
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=devcontainer-base
            org.opencontainers.image.description=Shared devcontainer base image for @himorogy projects

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cond.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ベースの node:24 を毎回引き直す。ランナー上の古いレイヤに引きずられないため。
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance はデフォルト (mode=min) のまま有効にしている。
          # GHCR のパッケージ画面に unknown/unknown が並ぶのは attestation が
          # OCI index 内の別 manifest として表現されるためで、アーキ対応が
          # 壊れているわけではない。公開ベースイメージでは供給元追跡の価値を優先する。

      # push した内容が実際に両アーキで起動するかを確認する。
      # QEMU 経由でも crit / pnpm は動くので、最低限の実行可能性は検出できる。
      - name: Smoke test pushed image
        if: steps.cond.outputs.push == 'true'
        run: |
          # outputs.tags の先頭を取ると metadata-action の priority 順に依存する。
          # outputs.version は主要タグのバージョン部分なので、こちらから組み立てる。
          tag="${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          echo "Testing ${tag}"
          for platform in linux/amd64 linux/arm64; do
            echo "--- ${platform} ---"
            docker run --rm --platform "${platform}" "${tag}" crit --version
            docker run --rm --platform "${platform}" "${tag}" pnpm --version
            docker run --rm --platform "${platform}" "${tag}" sh -c 'echo "$LANG"'
          done
