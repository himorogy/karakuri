name: devcontainer-base

# images/devcontainer-base のマルチアーキビルドと GHCR への push。
#
# トリガーの使い分け:
#   tag push (devcontainer-base-v*) … リリース。承認を経て :1 / :1.4 / :1.4.2 /
#                                     sha-xxxxxxx を push
#   pull_request                    … 検証ビルドのみ。push しない
#   workflow_dispatch               … 検証ビルドのみ。push しない
#
# GHCR へ push する経路はタグ 1 本だけにしている。承認を通さない push 経路を
# 残すと、承認ゲートを置いた意味がなくなるため。試作はローカルの
# `docker buildx build --platform linux/amd64,linux/arm64` で確認する。
#
# main への push はトリガーにしていない。浮動タグ :1 を参照する運用では
# 利用側が引くのはリリースタグだけで、main の各コミットを GHCR に積む必要がないため。
#
# action は全て commit SHA で固定する。タグは移動しうるため、上流が侵害されたときに
# そのまま実行されることを防ぐ。併記しているタグは、更新時に何を見ればよいかの手がかり。
#
# docker/* の 5 つはリポジトリの action 許可リストに明示的に載せてある。release ジョブは
# packages: write を持つため、第三者 action を動かすこと自体が
# docs/secure-publish.md §4.3 の原則から外れる。判断の根拠と、将来これを外す道筋は
# 同 §4.6 を参照。

on:
  push:
    tags:
      - "devcontainer-base-v*"
  pull_request:
    # 除外している 2 つは .dockerignore がビルドコンテキストから外しているものと
    # 同じ集合。イメージの内容に影響しないため、検証ビルドを走らせる意味がない。
    # 除外の行は positive の後に置く（後のパターンが勝つ）。
    paths:
      - "images/devcontainer-base/**"
      - "!images/devcontainer-base/**/*.md"
      - "!images/devcontainer-base/examples/**"
      - ".github/workflows/devcontainer-base.yml"
  workflow_dispatch:

# 既定では何も与えない。必要なジョブで最小限だけ宣言する。
permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devcontainer-base
  CONTEXT: images/devcontainer-base

# PR に続けて push したときの古い検証ビルドは捨てる。QEMU 経由のマルチアーキ
# ビルドは重く、途中の版の結果に用がない。
# リリース（タグ push）は途中で止めない。GHCR への push が中断されると、
# どのタグまで載ったのかが分からない状態になる。
concurrency:
  group: devcontainer-base-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # タグの内容を検証し、後段に渡す値を確定させる。
  # ここで弾けるものは、承認者の目に触れる前に弾く。
  # ------------------------------------------------------------------
  prepare:
    if: startsWith(github.ref, 'refs/tags/devcontainer-base-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # タグ名 devcontainer-base-v1.4.2 から 1.4.2 を取り出す。
      # metadata-action の type=semver は value を明示すれば ref に依存しない。
      - name: タグを分解する
        id: ver
        run: |
          set -eu
          version="${GITHUB_REF_NAME#devcontainer-base-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::タグ形式が不正です: ${GITHUB_REF_NAME} (期待: devcontainer-base-vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: タグが main の履歴に含まれることを確認する
        run: |
          set -eu
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::このタグは main の履歴にありません。レビューを経ていないコミットは公開できません。"
            exit 1
          fi

      # GHCR はタグの付け替えを許すため、同じ版を二度 push すると中身だけが
      # 入れ替わる。既に載っている版かどうかを、承認者を呼ぶ前に見る。
      - name: 未公開のバージョンであることを確認する
        run: |
          set -eu
          VERSION="${{ steps.ver.outputs.version }}"
          REPO_PATH="${{ github.repository_owner }}/devcontainer-base"

          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull" \
            | jq -r '.token // empty') || TOKEN=""

          if [ -z "$TOKEN" ]; then
            echo "::warning::GHCR のトークンを取得できませんでした。既存版の確認を飛ばします。"
            exit 0
          fi

          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/${VERSION}")

          case "$CODE" in
            404) echo "${VERSION} は未公開です。" ;;
            200)
              echo "::error::${IMAGE_NAME}:${VERSION} は既に存在します。同じ版を push すると中身が入れ替わります。"
              exit 1
              ;;
            *)
              echo "::warning::GHCR の応答が ${CODE} でした。既存版の確認を飛ばします。"
              ;;
          esac

  # ------------------------------------------------------------------
  # PR と手動実行の検証ビルド。GHCR には触れないので packages 権限を持たない。
  # ------------------------------------------------------------------
  verify:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: ビルドできることを確認する
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: false
          # ベースの node:24 を毎回引き直す。ランナー上の古いレイヤに引きずられないため。
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # GHCR への push。
  #
  # environment の承認設定が、実質的な公開権限になる。タグを打てる人間の
  # 単独判断で利用側の base image を差し替えられないようにするため、npm の
  # 公開ジョブと同じゲートを置いている（docs/secure-publish.md §4.8）。
  # ------------------------------------------------------------------
  release:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        env:
          # annotation を index にも付ける。既定は manifest のみだが、マルチアーキの
          # イメージで GHCR のパッケージ画面が読むのは OCI index 側の annotation。
          # manifest だけだとプラットフォーム別の manifest に付いて表示に反映されない。
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_NAME }}
          # metadata-action のデフォルト (latest=auto) は type=semver が有効なとき
          # :latest も生成する。タグ体系に含めていないので明示的に止める。
          flavor: |
            latest=false
          # semver の 3 行が :1.4.2 / :1.4 / :1 を生む。
          # value は prepare が検証済みのものを渡す。
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=devcontainer-base
            org.opencontainers.image.description=Shared devcontainer base image for @himorogy projects
          # labels 入力は annotations に反映されない。同じ内容をここにも書かないと、
          # annotation にはリポジトリ由来の title=karakuri と空の description が載る。
          annotations: |
            org.opencontainers.image.title=devcontainer-base
            org.opencontainers.image.description=Shared devcontainer base image for @himorogy projects

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # ベースの node:24 を毎回引き直す。ランナー上の古いレイヤに引きずられないため。
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance はデフォルト (mode=min) のまま有効にしている。
          # GHCR のパッケージ画面に unknown/unknown が並ぶのは attestation が
          # OCI index 内の別 manifest として表現されるためで、アーキ対応が
          # 壊れているわけではない。公開ベースイメージでは供給元追跡の価値を優先する。

      # push した内容が実際に両アーキで起動するかを確認する。
      # QEMU 経由でも crit / pnpm は動くので、最低限の実行可能性は検出できる。
      #
      # pnpm bin -g は PATH の検査を兼ねる。pnpm 11 は global bin を
      # ${PNPM_HOME}/bin に置くため、PATH に ${PNPM_HOME} しか載っていない
      # 古いレイアウトへ戻ると "global bin directory is not in PATH" で落ちる。
      # ビルドログには現れない種類の壊れ方なので、ここで検出する。
      - name: Smoke test pushed image
        run: |
          set -eu
          tag="${IMAGE_NAME}:${{ needs.prepare.outputs.version }}"
          echo "Testing ${tag}"
          for platform in linux/amd64 linux/arm64; do
            echo "--- ${platform} ---"
            docker run --rm --platform "${platform}" "${tag}" crit --version
            docker run --rm --platform "${platform}" "${tag}" pnpm --version
            docker run --rm --platform "${platform}" "${tag}" pnpm bin -g
            docker run --rm --platform "${platform}" "${tag}" sh -c 'echo "$LANG"'
          done
