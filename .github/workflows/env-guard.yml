name: env-guard

# 平文 env のコミットを CI 側で検知する reusable workflow。呼び出し側
# リポジトリの .github/workflows/env-guard.yml に 5 行のスタブ
# (images/runtime-base/templates/project/env-guard.yml) を置いて使う。
#
# 設計: docs/prod-secret-isolation-design.md §8.1 / §8.2
#
# ----------------------------------------------------------------------------
# 判定は 1 本。ここが変えるのはスコープだけ
#
# 検査ロジックそのものはこの workflow には無い。karakuri の
# packages/env-guard/bin/env-guard-scan 1 本に寄せてあり、コミット時の
# pre-commit hook (イメージが /usr/local/bin へ COPY したもの) が呼ぶのと
# 同じファイルである。この workflow の仕事は「tracked なファイルの一覧を
# 作ってスキャナへ流す」ことだけ。
#
#   hook … git diff --cached --name-only（staged なもの）
#   ここ … git ls-files（tracked なもの）
#
# 同じ一覧を与えれば判定も出力も完全に一致する。パターンや許可リストを
# 揃えるだけでは「hook は通るのに CI で落ちる」は消えない — 判定の実装が
# 2 つある限り必ずずれるため、実装ごと 1 本にしてある。
#
# 当初案の `dotenvx precommit` を CI で走らせる形は実測により破棄した
# (dotenvx 2.19.2)。precommit が見るのは `git diff HEAD` の差分だけで、
# CI のクリーンな checkout には差分が無い。平文のまま tracked になっている
# .env を 2 件見つけておきながら「encrypted/gitignored (2)」と表示して
# rc=0 を返す。単なる no-op ではなく「検査した風の緑」であり、検知装置と
# しては有害だった。
# ----------------------------------------------------------------------------
#
# 除外したいファイルや検査対象パターンの変更は、呼び出し側リポジトリの
# ルートに置く env-guard.conf で行う (workflow の input ではない)。
# hook と CI が同じファイルを同じ規則で読むことが要るため、真実の源を
# 1 つにしてある。書式は env-guard-scan の冒頭のコメントを参照。
#
# ----------------------------------------------------------------------------
# スキャナをどこから取るか
#
# 検査対象は呼び出し側のリポジトリだが、スキャナ本体は karakuri の持ち物
# なので、どこかから取ってくる必要がある。経路は 2 つだけである。
#
#   in-tree … 呼び出し側の作業ツリーに packages/env-guard/bin/env-guard-scan
#             が在る場合。これは karakuri が自分を呼んだときにしか起きない。
#             **この分岐は消してはいけない** — 消して npm 一本にすると、
#             スキャナを変更する PR が「変更前の公開済みスキャナ」で検査
#             される。緑にはなるが、その PR が持ち込んだ変更を一度も
#             通していない
#   npm     … それ以外 (他リポジトリからの呼び出し)。下の ENV_GUARD_VERSION
#             を npm pack で取得し、ENV_GUARD_SCAN_SHA256 と照合してから使う
#
# 以前はここで `github.job_workflow_ref` を parse して「自分がどの版の
# karakuri から来たか」を割り出し、karakuri を第二 checkout していた。
# **その値は実測で空だった** (ローカルパス呼び出しでも、同一リポジトリを
# 指す完全参照呼び出しでも) ため、他 org からの呼び出しが成立するかが未決の
# まま止まっていた。npm 経由なら版を workflow ファイル自身に直書きできる —
# workflow は自分の中身を知っているので、自分の ref を知る必要がない。
# 経緯は images/runtime-base/verification-record.md の項目 63 に残してある。
#
# **なぜ版の固定だけでは足りないか。** `npm pack` は取得物のハッシュを検証
# しない。レジストリが侵害されれば、他 org の CI で攻撃者の置いたスキャナが
# 走る。しかもそのスキャナは、平文の env を「問題なし」と報告するだけで
# 目的を達する — 落ちないので誰も気付かない。だから取得したファイルの
# SHA256 を、この workflow ファイルに直書きした期待値と照合する。
# **照合するまで一度も実行しない**（`npx -y ... env-guard-scan` のように
# 取得してすぐ実行する形にすると、照合の意味が無くなる）。
#
# **信頼の連鎖。** 呼び出し側は
#   uses: himorogy/karakuri/.github/workflows/env-guard.yml@<commit sha>
# の形で karakuri の commit を固定する。期待するハッシュはその commit の
# この workflow ファイルの中にあるので、連鎖は呼び出し側が固定した sha から
# 途切れずに繋がる。可変な ref (タグ) で呼ぶと、この起点が動く。
# ----------------------------------------------------------------------------

# 他リポジトリ向けのスキャナ取得経路で使う、版と期待ハッシュ。
# 上げるときは 2 つ一緒に上げる。ハッシュは
#   npm pack @himorogy/env-guard@<version>
#   tar -xzf himorogy-env-guard-<version>.tgz package/bin/env-guard-scan
#   sha256sum package/bin/env-guard-scan
# で取れる (リポジトリ内の packages/env-guard/bin/env-guard-scan と
# byte 単位で一致することも確かめる)。
env:
  ENV_GUARD_VERSION: 0.1.0
  ENV_GUARD_SCAN_SHA256: ed8189fd3b6cd31b24b41334e69a9becc278f5eec50546466e4afb9607c2535b

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          検査対象を絞りたい場合のディレクトリ。改行区切りで複数指定できる。
          既定（空）ではリポジトリ全体を検査する。これは「どこまで見るか」
          だけの指定であって、平文かどうかの判定を変えるものではない
          （判定は env-guard.conf とスキャナに閉じている）。指定すると
          CI はコミット時の hook より狭い範囲しか見ないことになる点に注意。
          なお `.env.keys`（私鍵そのもの）の探索だけはこの絞り込みに関係
          なくリポジトリ全体に効く。
        type: string
        required: false
        default: ""

jobs:
  env-guard:
    runs-on: ubuntu-latest

    # checkout に必要な read だけ。このジョブは何も書かない。
    permissions:
      contents: read

    steps:
      # action pin は既存の workflow (runtime-base-verify.yml 等) と同じ
      # commit SHA を使い回す。新しい action は増やさない。
      # reusable workflow の中の checkout は「呼び出し側」のリポジトリを
      # checkout する。これが検査対象になる。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # スキャナをどちらの経路で取るかを決めるだけのステップ。判定条件は
      # 「呼び出し側の作業ツリーにスキャナが在るか」1 つである。
      #
      # 在るのは、呼び出し側が karakuri のツリーを持っているとき —
      # つまりローカルパス呼び出し (karakuri の自己検査) のときだけである。
      # 他 org のプロジェクトに packages/env-guard/bin/env-guard-scan は
      # 無いので、誤って in-tree 側へ倒れることはない。
      #
      # self-call では in-tree の方が正しい: タグが指すスキャナではなく、
      # いま検査されている PR のスキャナが走る。版の食い違いが起きえないうえ、
      # スキャナを変更する PR がその変更を通ることになる。
      - name: Decide where the scanner comes from
        id: src
        shell: bash
        run: |
          set -u
          if [ -s packages/env-guard/bin/env-guard-scan ]; then
            echo "mode=in-tree" >>"$GITHUB_OUTPUT"
            echo "scanner source: the caller's own checkout (self-check)"
          else
            echo "mode=npm" >>"$GITHUB_OUTPUT"
            echo "scanner source: npm, @himorogy/env-guard@${ENV_GUARD_VERSION}"
          fi

      # 他リポジトリからの呼び出し。npm から取り、**照合してから**使う。
      #
      # 順序が要点である。取得 → 展開 → SHA256 照合 → (一致した場合だけ)
      # chmod +x。照合前に一度でも実行したら照合の意味が無いので、
      # `npx -y ... env-guard-scan` のような「取得してすぐ実行」する形には
      # しない。
      #
      # npm pack は $RUNNER_TEMP の下で走らせる。呼び出し側リポジトリの作業
      # ディレクトリで走らせると、相手の package.json や .npmrc を読ませる
      # ことになる (検査される側の設定が、検査する道具の取得に影響しうる)。
      #
      # node / npm は ubuntu-latest に最初から入っているので setup-node は
      # 要らない。npm のバージョンはランナー任せだが、取得物の同一性は
      # ハッシュ照合が見るので、ここは問題にならない。
      - name: Fetch the shared scanner from npm and verify its checksum
        if: steps.src.outputs.mode == 'npm'
        shell: bash
        run: |
          set -u

          work="$RUNNER_TEMP/env-guard-npm"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work" || {
            echo "❌ env-guard: could not use $work as a scratch directory."
            exit 1
          }

          if ! npm pack "@himorogy/env-guard@${ENV_GUARD_VERSION}"; then
            echo "❌ env-guard: could not fetch @himorogy/env-guard@${ENV_GUARD_VERSION} from npm."
            echo "   Nothing was inspected, so this is not a pass."
            exit 1
          fi

          # 標準出力を parse せず、置かれた物を数える。0 個でも 2 個以上でも
          # 「想定と違う」なので落とす。
          set -- ./*.tgz
          if [ "$#" -ne 1 ] || [ ! -s "$1" ]; then
            echo "❌ env-guard: npm pack did not leave exactly one tarball behind (got $#)."
            exit 1
          fi
          tarball="$1"

          if ! tar -xzf "$tarball" package/bin/env-guard-scan; then
            echo "❌ env-guard: the tarball does not contain package/bin/env-guard-scan."
            exit 1
          fi

          candidate="$work/package/bin/env-guard-scan"
          if [ ! -s "$candidate" ]; then
            echo "❌ env-guard: the extracted scanner is empty or missing."
            exit 1
          fi

          actual="$(sha256sum "$candidate" | cut -d' ' -f1)"
          if [ "$actual" != "$ENV_GUARD_SCAN_SHA256" ]; then
            echo "❌ env-guard: the scanner fetched from npm is not the one this workflow expects."
            echo "   expected: $ENV_GUARD_SCAN_SHA256"
            echo "   actual:   $actual"
            echo "   package:  @himorogy/env-guard@${ENV_GUARD_VERSION}"
            echo "   Version pinning alone does not protect against a tampered registry,"
            echo "   which is why this is checked. Refusing to run it."
            echo "   Nothing was inspected, so this is not a pass."
            exit 1
          fi

          # ここまで来て初めて実行可能にする。
          cp "$candidate" "$RUNNER_TEMP/env-guard-scan"
          chmod +x "$RUNNER_TEMP/env-guard-scan"
          cd "$RUNNER_TEMP" && rm -rf "$work"
          echo "env-guard: scanner verified (sha256 $actual)."

      - name: Stage the scanner outside the working tree
        shell: bash
        env:
          MODE: ${{ steps.src.outputs.mode }}
        run: |
          set -u
          staged="$RUNNER_TEMP/env-guard-scan"

          case "$MODE" in
          in-tree)
            src=packages/env-guard/bin/env-guard-scan
            if [ ! -s "$src" ]; then
              echo "❌ env-guard: the scanner is missing ($src)."
              echo "   Nothing was inspected, so this is not a pass."
              exit 1
            fi
            # 作業ツリーの外へ出してから使う。スキャナが検査対象のファイル
            # 一覧や .env.keys の探索範囲に混ざらないようにするため
            # (取得方法が変わっても、外へ出す理由は変わらない)。
            cp "$src" "$staged"
            chmod +x "$staged"
            ;;
          npm)
            # 前のステップが照合済みのものを置いている。置かれていなければ
            # 照合を通っていないということなので、ここで落とす (前のステップが
            # 何かの理由で走らなかった場合に、黙って先へ進ませない)。
            if [ ! -s "$staged" ]; then
              echo "❌ env-guard: no verified scanner was staged at $staged."
              echo "   Nothing was inspected, so this is not a pass."
              exit 1
            fi
            ;;
          *)
            echo "❌ env-guard: internal error — unknown scanner source mode '$MODE'."
            exit 1
            ;;
          esac

          if [ ! -x "$staged" ]; then
            echo "❌ env-guard: the staged scanner is not executable ($staged)."
            exit 1
          fi

      - name: Scan tracked files for plaintext env values
        shell: bash
        env:
          ENV_GUARD_PATHS: ${{ inputs.paths }}
        run: |
          set -u
          list="$RUNNER_TEMP/env-guard-list"
          ok=0

          # 一覧の作成に失敗したら通さない (fail-closed)。空の一覧は
          # 「検査対象が無かった」を意味するが、コマンド自体の失敗も同じ
          # 「空」に化けるため区別する。
          if [ -n "${ENV_GUARD_PATHS:-}" ]; then
            # 改行/空白区切りの複数ディレクトリを受けるため、ここだけは
            # 意図的に単語分割させる。
            # shellcheck disable=SC2086
            set -- $ENV_GUARD_PATHS
            git ls-files -- "$@" >"$list" || ok=$?
          else
            git ls-files >"$list" || ok=$?
          fi

          if [ "$ok" -ne 0 ]; then
            echo "❌ env-guard: could not list the tracked files (git ls-files failed)."
            echo "   Nothing was inspected, so this is not a pass."
            exit 1
          fi

          echo "env-guard: $(wc -l <"$list") tracked path(s) to consider."
          "$RUNNER_TEMP/env-guard-scan" <"$list"
