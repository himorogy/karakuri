# karakuri 自身の devcontainer（Docker Compose 構成）。
# 雛形 images/devcontainer-base/examples/docker-compose.yaml と対応するが、
# base の参照規律だけが違う（Dockerfile の N-1 pin コメントを参照。浮動タグを
# 使わないため、雛形の build.pull: true もここでは不要 — pin を上げたときに
# `docker compose build --pull` すればよい）。
#
# Compose はプロジェクトごとにユーザー定義ネットワーク（<name>_default）を
# 自動で作る。埋め込みリゾルバ 127.0.0.11 が使えるのはユーザー定義ネットワーク上
# だけ。判断の根拠は packages/egress-guard/README.md の「ネットワーク構成（推奨）」。

# ネットワーク名がこれを接頭辞に決まる（<name>_default）。**プロジェクトごとに
# 違う値にすること。** 1 つのネットワークを共有すると、同居するコンテナが相互に
# 名前解決して到達できる（packages/egress-guard/docs/design.md §4.4）。
#
# volume の実名はこれに依存しない。下の volumes で name: を明示しているため、
# ここを変えても履歴・claude / codex 設定は失われない。
name: karakuri-dev

services:
  dev:
    # runArgs は dockerComposeFile を使うと無視される。--name はここで指定する。
    # provision-devcontainer.sh がコンテナ名を <ワークスペース名>-dev-container で
    # 引くため、この名前を維持する。
    container_name: karakuri-dev-container

    build:
      context: .
      dockerfile: Dockerfile

    # --cap-add の置き換え。egress-guard が iptables と ipset を触るために要る。
    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      NODE_OPTIONS: --max-old-space-size=2048
      CLAUDE_CONFIG_DIR: /home/node/.claude

    # /run/secrets の置き場。tmpfs でないと、注入した鍵がコンテナの writable layer
    # （= ホストの不揮発ディスク）へ書かれてしまう。uid=/gid= の指定が無いと
    # root 所有で作られ、node ユーザーが /run/secrets を作れず書けない。
    # tmpfs はコンテナを停止 → 再起動するだけでも消えるので、起動のたびに
    # ホスト側の dev-inject スクリプトを実行し直すこと。
    tmpfs: ["/run:uid=1000,gid=1000,mode=0755"]

    # dev 鍵（dotenvx の local / dev 復号キーや dev 用のトークン）は env_file では
    # 注入しない。env_file はホスト上に恒久的な平文ファイルを要求し、コンテナの
    # environ にも常駐して docker inspect や全子プロセスから見えてしまう。
    # かわりに、コンテナ起動後にホスト側の dev-inject スクリプトで上の tmpfs
    # （/run/secrets）へ注入する。

    volumes:
      # workspaceMount の置き換え。リポジトリの親を /workspaces に載せる
      # （git worktree の共通 git dir を解決するため）。
      # **devcontainer.json の workspaceFolder と必ず一致させること。** ずれると
      # postCreateCommand が exit 127 で落ちる。
      - ../..:/workspaces:cached

      # 個人設定フック。ホスト側の共通ディレクトリを read-only で見せ、
      # /personal/setup.sh があれば postCreateCommand が実行する。ホスト側に
      # 置く理由は雛形（examples/docker-compose.yaml）のコメントを参照。
      - ~/.config/devc-personal:/personal:ro

      # devcontainer.json の mounts の置き換え。**${devcontainerId} は Compose では
      # 使えない**ため固定名にしてある。
      - karakuri-bashhistory:/commandhistory
      - karakuri-claude-config:/home/node/.claude
      - karakuri-codex-config:/home/node/.codex

    # ベースイメージの CMD は node なので、そのままだと即終了する。
    command: sleep infinity

volumes:
  karakuri-bashhistory:
    name: karakuri-bashhistory
  karakuri-claude-config:
    name: karakuri-claude-config
  karakuri-codex-config:
    name: karakuri-codex-config
