# karakuri 自身の devcontainer（Docker Compose 構成）。
# 雛形 images/devcontainer-base/examples/docker-compose.yaml と対応するが、
# 2 点だけ違う。
#
# - **base の参照規律**（Dockerfile の N-1 pin コメントを参照）。浮動タグを
#   使わないため、雛形の dev.build.pull: true もここでは不要 — pin を上げたときに
#   `docker compose build --pull` すればよい
# - **egress-proxy の build context。** 雛形は利用側が templates/proxy/ を
#   自分の .devcontainer/proxy/ へコピーする前提で書かれている。このリポジトリは
#   その配布元そのものなので、コピーを作ると配布物と実際に動いているものが
#   静かに食い違いうる。`.devcontainer/proxy` は
#   `packages/egress-guard/templates/proxy` へのシンボリックリンクであり、写しではない
#
# Compose はプロジェクトごとにユーザー定義ネットワーク（<name>_default）を
# 自動で作る。埋め込みリゾルバ 127.0.0.11 が使えるのはユーザー定義ネットワーク上
# だけ。判断の根拠は packages/egress-guard/README.md の「ネットワーク構成（推奨）」。

# ネットワーク名がこれを接頭辞に決まる（<name>_default）。**プロジェクトごとに
# 違う値にすること。** 1 つのネットワークを共有すると、同居するコンテナが相互に
# 名前解決して到達できる（packages/egress-guard/docs/design.md §4.4）。
#
# volume の実名はこれに依存しない。下の volumes で name: を明示しているため、
# ここを変えても履歴・claude / codex 設定は失われない。
name: karakuri-dev

services:
  dev:
    # runArgs は dockerComposeFile を使うと無視される。--name はここで指定する。
    # provision-devcontainer.sh がコンテナ名を <ワークスペース名>-dev-container で
    # 引くため、この名前を維持する。
    container_name: karakuri-dev-container

    build:
      context: .
      dockerfile: Dockerfile

    # firewall.json が実現層 l7（既定）を選んでいる前提。init-project-firewall.sh
    # は egress-proxy の名前解決を要求するため、先に立っていないと
    # postStartCommand が失敗する。
    depends_on:
      - egress-proxy

    # --cap-add の置き換え。egress-guard が iptables と ipset を触るために要る。
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # egress-proxy のアクセスログは proxy（uid/gid 13。proxy/Dockerfile の
    # `USER proxy`）が書き、他ユーザーからは読めないパーミッションで作られる
    # （先行検証で実測済み、0021 の検収で確認する）。node（uid 1000）を補助
    # グループ 13 に入れないと :ro でマウントしても Permission denied になる。
    group_add: ["13"]

    # 環境変数の置き場はここが既定。イメージの ENV に置くのは利用側が変える前提が
    # 無いものだけ（docs/conventions.md「環境変数の置き場」）。
    environment:
      NODE_OPTIONS: --max-old-space-size=2048

      # egress-proxy への配線。大文字・小文字の両方が要る — curl と apt は小文字しか
      # 読まない。サービス名はユーザー定義ネットワーク上でだけ Docker の埋め込み
      # リゾルバが解決する。
      http_proxy: "http://egress-proxy:3128"
      https_proxy: "http://egress-proxy:3128"
      HTTP_PROXY: "http://egress-proxy:3128"
      HTTPS_PROXY: "http://egress-proxy:3128"

      # loopback 宛の内部通信（エディタ拡張の hook 通知など）まで proxy へ回さない。
      no_proxy: "localhost,127.0.0.1"
      NO_PROXY: "localhost,127.0.0.1"

      # Node の fetch (undici) は既定で proxy 環境変数を読まない。opt-in が要る。
      NODE_USE_ENV_PROXY: "1"

      # 明示しないと .claude.json が /home/node/.claude.json（下の named volume の外）
      # に置かれ、コンテナを作り直すたびに失われる。設定すると .claude.json を含む
      # 全部がこのパスの下に入る。既定値と同じに見えるが同じではない。
      CLAUDE_CONFIG_DIR: /home/node/.claude

      # crit の既定はランダムポート。ホスト側 ~/.ssh/config の LocalForward を静的に
      # 書けるよう固定する。同時に開く別プロジェクトと衝突したらここをずらす
      # （base の PORT-FORWARDING.md「crit のポート」）。
      CRIT_PORT: "4588"

      # crit は Host ヘッダを検査し、localhost と loopback IP 以外を 403 で拒む。
      # karakuri.test で開くには広告 URL でホスト名を 1 つ与える。広告 URL は bind を
      # 変えないため listen は 127.0.0.1 のまま。ポートは CRIT_PORT と揃える。
      #
      # CRIT_ALLOW_UNAUTHENTICATED_NETWORK は機能の有効化ではなく承認である。新しい
      # crit は広告 URL の指定だけでネットワーク露出とみなして起動を拒否する。base に
      # 焼くと listen が非 loopback のときの拒否まで消えるため、承認を必要とする判断
      # （ホスト名で開く）と同じ場所に置く。
      CRIT_PUBLIC_URL: http://karakuri.test:4588
      CRIT_ALLOW_UNAUTHENTICATED_NETWORK: "1"

    # /run/secrets の置き場。tmpfs でないと、注入した鍵がコンテナの writable layer
    # （= ホストの不揮発ディスク）へ書かれてしまう。uid=/gid= の指定が無いと
    # root 所有で作られ、node ユーザーが /run/secrets を作れず書けない。
    # tmpfs はコンテナを停止 → 再起動するだけでも消えるので、起動のたびに
    # ホスト側の dev-inject スクリプトを実行し直すこと。
    tmpfs: ["/run:uid=1000,gid=1000,mode=0755"]

    # dev 鍵（dotenvx の local / dev 復号キーや dev 用のトークン）は env_file では
    # 注入しない。env_file はホスト上に恒久的な平文ファイルを要求し、コンテナの
    # environ にも常駐して docker inspect や全子プロセスから見えてしまう。
    # かわりに、コンテナ起動後にホスト側の dev-inject スクリプトで上の tmpfs
    # （/run/secrets）へ注入する。

    volumes:
      # workspaceMount の置き換え。リポジトリの親を /workspaces に載せる
      # （git worktree の共通 git dir を解決するため）。
      # **devcontainer.json の workspaceFolder と必ず一致させること。** ずれると
      # postCreateCommand が exit 127 で落ちる。
      - ../..:/workspaces:cached

      # 個人設定フック。ホスト側の共通ディレクトリを read-only で見せ、
      # /personal/setup.sh があれば postCreateCommand が実行する。ホスト側に
      # 置く理由は雛形（examples/docker-compose.yaml）のコメントを参照。
      - ~/.config/devc-personal:/personal:ro

      # devcontainer.json の mounts の置き換え。**${devcontainerId} は Compose では
      # 使えない**ため固定名にしてある。
      - karakuri-bashhistory:/commandhistory
      - karakuri-claude-config:/home/node/.claude
      - karakuri-codex-config:/home/node/.codex

      # egress-proxy の access log。ro — 書ける状態にすると、侵害された
      # エージェントが自分の通信記録を消せる。egress-proxy 側は rw で
      # 同じ named volume をマウントする。
      - karakuri-proxy-log:/var/log/egress-proxy:ro

    # ベースイメージの CMD は node なので、そのままだと即終了する。
    command: sleep infinity

  # L7 egress proxy sidecar。イメージの実体は packages/egress-guard/templates/proxy
  # を compose から直接参照する（`.devcontainer/proxy` はそのディレクトリへの
  # シンボリックリンクであり、写しではない）。firewall.json が実現層 l7（既定）を
  # 選んでいる限り必須 — init-project-firewall.sh はこのサービス名を DNS で
  # 解決できることを前提に最終テーブルを組む。
  egress-proxy:
    build:
      # dev と同じディレクトリ。proxy/Dockerfile が firewall.json を COPY する
      # ため、firewall.json はここ（.devcontainer/ = context root）にある必要が
      # ある。proxy/ 以下は上記のとおりシンボリックリンク。
      context: .
      dockerfile: proxy/Dockerfile
      # proxy/Dockerfile の FROM は node:24-bookworm-slim / debian:bookworm-slim
      # という浮動タグ。dev の Dockerfile とは違い pin していないため、こちらは
      # pull を有効にする（雛形 images/devcontainer-base/examples/docker-compose.yaml
      # の egress-proxy と同じ）。
      pull: true

    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

    # 起動時から proxy（uid 13）で動かす。root から降格させようとすると
    # cap_drop: [ALL] の下で失敗して落ちる（templates/proxy/Dockerfile 参照）。
    user: "13:13"

    read_only: true
    tmpfs:
      - /var/spool/squid:uid=13,gid=13
      - /run:uid=13,gid=13

    # access log だけは名前付きボリューム。egress-proxy 側は rw、dev 側は
    # 上の volumes で ro としてマウントする。tmpfs だとコンテナをまたいで
    # 共有できない。
    volumes:
      - karakuri-proxy-log:/var/log/squid

    # ports: は置かない。ホストへ公開しない。dev からはユーザー定義ネットワーク
    # 上のサービス名 (egress-proxy:3128) で到達する。

volumes:
  karakuri-bashhistory:
    name: karakuri-bashhistory
  karakuri-claude-config:
    name: karakuri-claude-config
  karakuri-codex-config:
    name: karakuri-codex-config
  karakuri-proxy-log:
    name: karakuri-proxy-log
