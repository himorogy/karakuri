# env-guard.yml — 平文 env のコミットを CI 側で検知する workflow のスタブ
#
# 各プロジェクトの `.github/workflows/env-guard.yml` としてこのまま置き、
# 下の `uses:` の ref だけを埋める。検査ロジックはこのファイルにも、
# 呼び出す先の workflow にも入っていない。npm パッケージ
# `@himorogy/env-guard` が配る env-guard-scan という 1 本のスキャナに集約して
# あり、workflow はそれを取り寄せて tracked ファイルの一覧を流すだけである。
# プロジェクト側に残るのは下の 4 行だけになる。
#
# 呼び出された workflow は、スキャナの版と期待する SHA256 を自分の中に持って
# いる。npm から取ったものをその期待値と照合し、一致した場合にだけ実行する
# （版の固定だけでは足りない。`npm pack` は取得物のハッシュを検証しないので、
# レジストリが侵害されれば「平文を問題なしと報告するだけ」のスキャナが CI で
# 走りうる）。取得や照合に失敗したときは検査を飛ばさず落ちる — 検査が走らな
# かったことが緑になることはない。
#
# 同じスキャナを dev container の pre-commit hook も呼ぶ。違うのは渡す
# ファイル一覧だけ（hook は staged、CI は tracked）で、判定は完全に同一に
# なる。「手元では通ったのに CI で落ちる」（およびその逆）が構造的に起きない
# ようにするための作りである。
#
# 検査の中身: `.env*` / `secret.env.*` に当たるファイルを走査し、コメント
# でも `DOTENV_PUBLIC_KEY` でもない行が `KEY="encrypted:..."` の形になって
# いなければ落とす。`.env.keys`（dotenvx の私鍵そのもの）が作業ツリーに
# あれば無条件で落とす。検出しても値そのものはログに出さない（ファイル・
# 行番号・変数名まで）。
#
# ---------------------------------------------------------------------------
# プロジェクトごとの調整は env-guard.conf で行う
#
# リポジトリのルートに `env-guard.conf` を置くと、検査対象のパターンと
# 許可リストを上書きできる。workflow の input ではなくこのファイルに寄せて
# あるのは、hook と CI が同じ設定を読むようにするためである（真実の源が
# 2 つあると、そこから判定がずれていく）。
#
#   # 1 行 1 ディレクティブ。コメントは行頭のみ。
#   # pattern 行が 1 行でもあれば既定のパターンを「置き換える」。allow も同様。
#   pattern (^|/)\.env
#   pattern (^|/)secret\.env\.
#   pattern (^|/)[^/]*\.env$        … production.env のような名前も拾いたい場合
#   allow   *.env.container.example
#   allow   docs/.env.sample
#
# 既定（ファイルが無い場合）は pattern が `(^|/)\.env` と
# `(^|/)secret\.env\.`、allow が `*.env.container.example`。
# 設定ファイルが壊れている・読めないときは、既定へ倒さずジョブが落ちる。
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# 呼び出し側 org の設定について
#
# org の Actions ポリシーが「選択した actions / reusable workflows のみ
# 許可」になっている場合、`himorogy/karakuri/*` を allowlist へ明示的に
# 追加しないとこの workflow は起動できない（Settings → Actions → General
# → Allow specified actions and reusable workflows）。これはプランによる
# 制限ではなく設定項目なので、どのプランでも追加すれば通る。
#
# 検知はできてもマージのブロックまではできない場合がある。必須ステータス
# チェックは private リポジトリでは有償プランを要するため、無償プランの
# private リポジトリでは「赤くなる」検知にとどまる。それを前提にしている。
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# ref は karakuri の commit SHA で固定することを推奨する
#
# 下の `uses:` の `@` より後ろが、この検査の信頼の起点になる。スキャナが
# 正しいものかどうかを決める期待ハッシュは、その ref にある karakuri の
# workflow ファイルの中に書かれている。つまり「どの ref を指すか」を決めた
# 時点で、実際に走るスキャナまでが決まる。
#
#   commit SHA … 指す先が動かない。一度中身を読んで納得すれば、その中身が
#                走ることが以後も保証される。更新は自分で SHA を差し替えた
#                ときにだけ起きるので、差分がレビューに乗る
#   タグ (@v1) … 楽だが、タグは付け替えられる。指す先が動くということは、
#                期待ハッシュも一緒に動くということで、固定したつもりの
#                ものが固定されていない
#
# 更新の手間と引き換えに何を得ているかで選ぶ。判断できないならタグではなく
# SHA を採る（後からタグへ緩めるのは簡単だが、逆は「いつから何が走っていたか」
# を遡って調べる作業になる）。SHA は karakuri のリリース（またはコミット履歴）
# から取る。
#
# ref を埋めないまま置くと workflow は起動できずエラーになる。検査が黙って
# 素通りするより良い形として、そうしてある。
# ---------------------------------------------------------------------------

on: [push, pull_request]

jobs:
  env-guard:
    # REPLACE_WITH_KARAKURI_COMMIT_SHA を karakuri の commit SHA (40 桁) に
    # 置き換える。タグで運用する場合は `@v1` のように書き換えてよいが、
    # 上の注意を読んでからにすること。
    uses: himorogy/karakuri/.github/workflows/env-guard.yml@REPLACE_WITH_KARAKURI_COMMIT_SHA
    # 大きな monorepo で検査範囲を絞りたい場合だけ指定する。改行区切りで
    # 複数書ける。これは「どこまで見るか」だけの指定で、平文かどうかの
    # 判定は変わらない（判定は env-guard.conf 側）。指定すると CI は
    # コミット時の hook より狭い範囲しか見なくなる点に注意。
    #
    # with:
    #   paths: |
    #     packages
    #     services
