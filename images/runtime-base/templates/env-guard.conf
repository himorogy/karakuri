# env-guard.conf — 平文 env 検査の対象をこのリポジトリ用に上書きする
#
# 置き場所はリポジトリのルート。**既定で足りるなら置かなくてよい。**
# 置かない状態が既定であり、それが多くのプロジェクトの正しい状態である。
#
# このファイルはコミット時の pre-commit hook と CI の両方が読む。判定を行う
# スキャナが 1 本しかないため、片方にだけ効くということが起こらない。
#
# 書式は 1 行 1 設定。`#` で始まる行と空行は無視される。
# **このファイルは実行されない**（source ではなく行単位でパースされる）ので、
# シェルの構文を書いても意味はない。
#
# ファイル名がドットで始まらないのは意図的である。`.env-guard.conf` にすると
# 既定のパターン `(^|/)\.env` に自分自身が一致し、設定ファイルが env ファイル
# として検査されて必ず落ちる。

# ---------------------------------------------------------------------------
# pattern — 検査対象にするファイル名の正規表現（ERE）。複数行書ける。
#
# 既定:
#   pattern (^|/)\.env
#   pattern (^|/)secret\.env\.
#
# 既定は basename が `.env` で始まるものだけを拾う。`.env` / `.env.production`
# / `apps/api/.env.local` は対象になるが、**`production.env` や
# `config/dev.env` は対象にならない**。そういう名前を使っているなら明示する。
#
# 1 行でも pattern を書くと、既定は**置き換わる**（追加ではない）。既定も
# 残したいなら既定の 2 行も書くこと。
# ---------------------------------------------------------------------------

# pattern (^|/)\.env
# pattern (^|/)secret\.env\.
# pattern (^|/)[^/]*\.env$

# ---------------------------------------------------------------------------
# allow — 検査から外すパスの glob。複数行書ける。
#
# 既定:
#   allow *.env.container.example
#
# 平文のプレースホルダを持つサンプルファイルなど、平文であることが正常な
# ものをここに書く。pattern と同じく、1 行でも書けば既定は置き換わる。
#
# **既定を緩める方向の変更は、その理由がこのファイルに残る形で行うこと。**
# 何を許したのかがリポジトリに残らないと、後から棚卸しができない。
# ---------------------------------------------------------------------------

# allow *.env.container.example
# allow docs/**/.env.sample

# ---------------------------------------------------------------------------
# 上書きの対象にならないもの
#
# - `.env.keys`（私鍵そのもの）が tracked になっていれば、pattern にも allow
#   にも関係なく必ず失敗する。どの部分木を見てくれと言われたかに関わらず
#   致命的であるため
# - 「値が暗号化されているか」の判定そのもの。`KEY="encrypted:..."` の形で
#   あることを要求する規則は変えられない
# ---------------------------------------------------------------------------
