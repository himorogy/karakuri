# プロジェクト側 docker-compose.yaml の雛形。
# .devcontainer/docker-compose.yaml としてコピーし、<your-project> と CRIT_PORT を差し替える。
#
# egress-guard が第一に推奨する構成が Compose。理由はネットワークにある。
# Compose はプロジェクトごとにユーザー定義ネットワーク (<name>_default) を自動で作り、
# その上でだけ Docker の埋め込みリゾルバ 127.0.0.11 が使える。デフォルトブリッジだと
# ホスト側の DNS アドレス宛に外向きの穴が 1 つ開く。
# 判断の根拠は packages/egress-guard/README.md の「ネットワーク構成（推奨）」。
#
# **runArgs は dockerComposeFile を使うと黙って無視される。** ポート転送・cap・環境変数・
# マウントは、devcontainer.json ではなくこのファイルに書く。

# ネットワーク名がこれを接頭辞に決まる (<name>_default)。
# プロジェクトごとに違う値にすること。1 つのネットワークを共有すると、同居する
# コンテナが相互に名前解決して到達できる。
name: dotfiles-dev

services:
  dev:
    # runArgs の --name の置き換え。
    container_name: dotfiles-dev-container

    build:
      # このファイルからの相対。firewall.json も .devcontainer/ にある前提。
      context: .
      dockerfile: Dockerfile
      # **必須。** 浮動タグ :1 を参照するので、これがないとローカルに残った古い base が
      # 使われ続け、リビルドしても更新が反映されない。
      # devcontainer.json の "build": { "options": ["--pull"] } は dockerComposeFile を
      # 使うと効かないため、Compose 側のこれが代わりになる。
      pull: true

    # runArgs の --cap-add の置き換え。egress-guard が iptables と ipset を触るために要る。
    # **これが効いていないと postStartCommand が失敗する。** 案 A の成否そのもの。
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # containerEnv の置き換え。**devcontainer.json の containerEnv は Compose 構成では
    # 効かない。** 環境変数はここに書く。
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # 下の ports と同じ値にする。
      CRIT_PORT: "4518"
      # git の認証を /run/secrets/GH_TOKEN から取る（注入されていなければ、認証が
      # 要る操作が非ゼロ終了して顕在化する）。パス自体は秘匿情報ではないので、
      # 環境変数で渡してよい。
      GIT_ASKPASS: /usr/local/bin/git-askpass

    # /run/secrets の置き場。tmpfs でないと、注入した鍵がコンテナの writable layer
    # （= ホストの不揮発ディスク）へ書かれてしまう。uid=/gid= の指定が無いと
    # root 所有で作られ、node ユーザーが /run/secrets を作れず書けない。
    # tmpfs はコンテナを停止 → 再起動するだけでも消えるので、起動のたびに
    # ホスト側の dev-inject スクリプトを実行し直すこと。
    tmpfs: ["/run:uid=1000,gid=1000,mode=0755"]

    # dev 鍵（dotenvx の local / dev 復号キーや dev 用のトークン）は env_file では
    # 注入しない。env_file はホスト上に恒久的な平文ファイルを要求し、コンテナの
    # environ にも常駐して docker inspect や全子プロセスから見えてしまう。
    # かわりに、コンテナ起動後にホスト側の dev-inject スクリプトで上の tmpfs
    # （/run/secrets）へ注入する。

    # runArgs の -p の置き換え。crit のポート転送。
    # プロジェクトごとに重複しない値を割り当てる。base で CRIT_HOST=0.0.0.0 を
    # 設定済みのため、この転送が実際に届く。127.0.0.1 に固定してホスト外へ露出させない。
    ports:
      - "127.0.0.1:4518:4518"

    volumes:
      # workspaceMount の置き換え。このファイルからの相対なので、../.. は
      # **リポジトリの親ディレクトリ**。リポジトリ本体ではない。
      #
      # 親を載せるのは git worktree を使うため。worktree の共通 git dir は
      # 別ディレクトリ (<親>/<repo>/.git) にあり、リポジトリ本体だけをマウントすると
      # 解決できずに壊れる。同居する兄弟ディレクトリがコンテナから見えるのは
      # 引き換え。worktree を使わないなら ..:/workspaces/<your-project> でよい。
      #
      # **devcontainer.json の workspaceFolder と必ず一致させること。** ずれると
      # postCreateCommand が exit 127 で落ち、原因に辿り着きにくい。
      - ../..:/workspaces:cached

      # mounts の置き換え。**${devcontainerId} は Compose では使えない**ため固定名にする。
      # 名前が固定なので、プロジェクトをまたいで衝突しないよう <your-project> を含める。
      - dotfiles-history:/commandhistory
      - dotfiles-claude-config:/home/node/.claude
      - dotfiles-codex-config:/home/node/.codex

    # base イメージの CMD は node なので、そのままだと即終了する。
    command: sleep infinity

volumes:
  dotfiles-history:
  dotfiles-claude-config:
  dotfiles-codex-config:
