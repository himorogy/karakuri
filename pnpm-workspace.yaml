# pnpm-workspace.yaml
packages:
  - 'packages/*'

# catalog: は置いていない。バージョンを揃える相手が居ないためである。
# 以前は typescript / @types/node / tsup を並べていたが、使っていたのは
# packages/enclave-env だけで、それを廃止した時点で使い手がゼロになった。
#
# 使われない catalog を残すのは害がある。将来のパッケージが `"typescript":
# "catalog:"` と書いた瞬間、誰も見直していない範囲指定が黙って適用される。
# 揃える相手が 2 つ以上できてから、そのときの版で書き直すこと。

# 依存のビルドスクリプトを走らせるかどうかを、パッケージごとに明示する。
# pnpm 11 は strictDepBuilds を既定で有効にしており、判断が書かれていない
# ビルドスクリプトが残っていると install が ERR_PNPM_IGNORED_BUILDS で失敗する。
#
# esbuild は false。これを引き込んでいたのは enclave-env の tsup だけなので、
# 現在この宣言に該当する依存は無い。残してあるのは、拒否側に倒れた宣言であり
# 残っていても新たに何かが動き出すことはないためと、同じ判断を二度させない
# ためである。プラットフォーム別のバイナリは @esbuild/<platform> という
# optional 依存として入るため、postinstall を走らせなくてもビルドは通る。
allowBuilds:
  esbuild: false
